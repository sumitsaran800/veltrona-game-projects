<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator - Premium</title>
    <!-- Crypto JS for Signature Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1011;
            --bg-panel: #1b1c2d;
            --primary-red: #E50539;
            --primary-green: #28a909;
            --text-white: #ffffff;
            --text-gray: #9ea0a9;
            --accent-glow: rgba(229, 5, 57, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-white); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header {
            height: 60px; background: var(--bg-panel); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid #2a2b3e; z-index: 50;
        }
        .logo { font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: -1px; }
        .logo span { color: var(--primary-red); }
        .balance-pill {
            background: #000; border: 1px solid #333; padding: 6px 16px; border-radius: 30px; font-weight: 700; font-size: 14px; display: flex; gap: 5px; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .curr { color: var(--primary-green); }

        /* HISTORY BAR */
        .history-strip {
            height: 34px; background: #13141b; display: flex; align-items: center; padding: 0 10px; gap: 6px; overflow-x: auto; z-index: 40; border-bottom: 1px solid #222;
        }
        .hist-pill {
            padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; min-width: 50px; text-align: center; color: #fff; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        }
        .h-blue { color: #3b82f6; background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.3); }
        .h-purple { color: #d946ef; background: rgba(217,70,239,0.15); border-color: rgba(217,70,239,0.3); }
        .h-red { color: var(--primary-red); background: rgba(229,5,57,0.15); border-color: rgba(229,5,57,0.3); }

        /* GAME STAGE */
        .game-stage {
            flex: 1; position: relative; background: radial-gradient(circle at center, #232433 0%, #0f1011 100%); overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        canvas { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        
        .center-hud { position: absolute; text-align: center; z-index: 10; top: 40%; left: 50%; transform: translate(-50%, -50%); }
        .multiplier-txt { font-size: 72px; font-weight: 900; color: #fff; text-shadow: 0 0 30px rgba(0,0,0,0.5); letter-spacing: -2px; }
        .crashed { color: var(--primary-red); text-shadow: 0 0 30px var(--accent-glow); }
        .waiting { font-size: 20px; color: #888; animation: pulse 1s infinite; font-weight: 600; margin-top: 10px; }
        .flew-txt { font-size: 28px; font-weight: 900; color: var(--primary-red); margin-bottom: 5px; display: none; text-shadow: 0 0 20px rgba(229,5,57,0.6); }

        #plane-svg { width: 160px; position: absolute; z-index: 5; display: none; filter: drop-shadow(0 0 20px rgba(229,5,57,0.8)); }

        /* WIN MODAL */
        .win-modal {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: rgba(16, 20, 30, 0.95); border: 2px solid var(--primary-green);
            padding: 20px 50px; border-radius: 50px; text-align: center; z-index: 100;
            display: none; box-shadow: 0 0 50px rgba(40,169,9,0.4); backdrop-filter: blur(10px);
            opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .win-modal.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .win-label { font-size: 12px; color: #ccc; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .win-value { font-size: 36px; font-weight: 900; color: var(--primary-green); }

        /* CONTROLS */
        .controls {
            background: #0e0f16; border-top: 1px solid #2a2b3e; padding: 10px; display: flex; gap: 10px;
            flex-direction: column; z-index: 20;
        }
        .bet-panel {
            background: var(--bg-panel); padding: 12px; border-radius: 12px; border: 1px solid #2a2b3e;
            display: flex; gap: 10px; align-items: center; position: relative;
        }
        .input-wrap {
            flex: 1; background: #0b0c10; border: 1px solid #333; border-radius: 8px; display: flex; align-items: center; padding: 4px; height: 48px;
        }
        .btn-mini {
            width: 32px; height: 32px; border-radius: 6px; background: #2a2b3e; color: #fff; border: none; font-size: 18px; cursor: pointer; transition: 0.1s;
        }
        .btn-mini:active { background: #444; }
        .bet-input {
            flex: 1; background: transparent; border: none; color: #fff; text-align: center; font-weight: 700; font-size: 18px; outline: none;
        }
        
        .btn-action {
            flex: 1.2; height: 48px; border-radius: 8px; border: none; font-weight: 800; font-size: 16px; color: #fff; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); transition: all 0.1s; position: relative; overflow: hidden;
        }
        .btn-green { background: linear-gradient(180deg, #28a909 0%, #176d03 100%); box-shadow: 0 4px 0 #104d02; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .btn-orange { background: linear-gradient(180deg, #ffbf00 0%, #c49200 100%); box-shadow: 0 4px 0 #8f6b00; color: #000; display: none; }
        .btn-red { background: linear-gradient(180deg, #E50539 0%, #9e0023 100%); box-shadow: 0 4px 0 #700019; display: none; }
        .btn-sub { font-size: 10px; font-weight: 500; opacity: 0.8; margin-top: 2px; }
        
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 0; }

        /* FAKE PLAYERS */
        .bottom-tabs { flex: 1; background: #0f1011; display: flex; flex-direction: column; min-height: 150px; }
        .tabs-header { display: flex; background: #1b1c2d; border-bottom: 1px solid #333; }
        .tab-item { flex: 1; text-align: center; padding: 12px; font-size: 12px; font-weight: 700; color: var(--text-gray); cursor: pointer; transition: 0.2s; }
        .tab-item.active { color: #fff; border-bottom: 3px solid var(--primary-red); background: rgba(255,255,255,0.02); }
        
        .bets-list { flex: 1; overflow-y: auto; padding: 5px 0; }
        .bet-row { display: flex; justify-content: space-between; padding: 6px 15px; border-bottom: 1px solid #1a1b25; font-size: 12px; animation: slideIn 0.3s ease; }
        .user-col { display: flex; gap: 8px; align-items: center; color: #ccc; }
        .avatar { width: 22px; height: 22px; background: #2a2b3e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #888; }
        .win-green { color: var(--primary-green); font-weight: 700; }
        .mult-badge { background: #222; padding: 2px 6px; border-radius: 4px; font-weight: 600; color: #fff; border: 1px solid #333; }

        @media (min-width: 768px) { .controls { flex-direction: row; } }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        @keyframes slideIn { from { transform: translateY(-5px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">Avia<span>tor</span></div>
        <div class="balance-pill">
            <span class="curr">₹</span>
            <span id="balDisplay">Loading...</span>
        </div>
    </header>

    <div class="history-strip" id="historyBar"></div>

    <div class="game-stage" id="stage">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Plane SVG (Base64 for performance) -->
        <img id="plane-svg" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNTAgNzQiPjxwYXRoIGZpbGw9IiNFMDUwMzkiIGQ9Ik0xMzMuNiAzMS45bC0uNS0uMS0uMi4xcS0uNi4zLS41LjggMSA0LjggMi4xIDkuMy4yLjcuMS42bC4yLS4xcTMtMi4zIDYuOS02LjQgMS0xLjItLjQtMS45LTMtMS40LTguNi0yLjJtLjQgMi4xcS0uMS0uMi0uMS0uMy4xLS4zLjQtLjRsLjEtLjEgMi42LjRxMi42LjYgMy41IDFsLjYuM2wtNi41IDEuNy0uNy0zLjFtMS43IDEwLjlsLS44LS4xLjYgMTEuM3EuMSAxLjQgMSAzLjMuMyAxIDEuMiAzLjFsNC41IDExcS4xLjUuNS41LjUuMS44LS4zIDEuNS0xLjMgMS40LTIuOC0uNi0xMS41LTEuNi0xNi41bC00LTEyLjFxLTEuNSAxLjQtMi45IDIuM2wtLjUuMm02LjggMjYuNWwtLjEuM3EtMy45LTguNy01LjQtMTMuNC0uMy0uOS4xLTEuNGwuNy0uNCA1LjUgMTIuMnEuOCAyLjMtLjcgMy4xbC0uMi4ybS0xMy4xLTcxcS0uMS0uMy0uNS0uNC0uNC0uMS0uNy4yLTEuNiAxLjYtMS41IDMuNC41IDEwLjYgMS42IDE2bDMuOCAxMC40LjcuMy41LS4xcTEuNS4xIDMuNS43bC0uOC0xMS42cS0uMi0yLjctMi4xLTcuMWwtNC41LTExLjJtLS40IDEuNmwuMS4xcTMuMiA3LjkgNC44IDEzIC43IDEuNS0uNSAxLjlsLS4yLjEtLjItLjJRLTQuNi05LjEtNS4zLTExLjZsMS0zLjNsLjEtLjF6Ii8+PC9zdmc+">

        <div class="center-hud">
            <div class="flew-txt" id="flewText">FLEW AWAY!</div>
            <div class="multiplier-txt waiting" id="mainText">CONNECTING...</div>
        </div>

        <div class="win-modal" id="winModal">
            <div class="win-label">YOU WON</div>
            <div class="win-value" id="winAmount">0.00</div>
        </div>
    </div>

    <!-- DUAL BET CONTROLS -->
    <div class="controls">
        <!-- Panel 1 -->
        <div class="bet-panel">
            <div class="input-wrap">
                <button class="btn-mini" onclick="adj(1, -10)">-</button>
                <input type="number" id="bet1" class="bet-input" value="10">
                <button class="btn-mini" onclick="adj(1, 10)">+</button>
            </div>
            <button class="btn-action btn-green" id="btnBet1" onclick="placeBet(1)">BET <span class="btn-sub">NEXT ROUND</span></button>
            <button class="btn-action btn-orange" id="btnCash1" onclick="cashOut(1)">CASHOUT <span class="btn-sub" id="cv1">0.00</span></button>
            <button class="btn-action btn-red" id="btnCan1" onclick="cancel(1)">CANCEL</button>
        </div>

        <!-- Panel 2 -->
        <div class="bet-panel">
            <div class="input-wrap">
                <button class="btn-mini" onclick="adj(2, -10)">-</button>
                <input type="number" id="bet2" class="bet-input" value="10">
                <button class="btn-mini" onclick="adj(2, 10)">+</button>
            </div>
            <button class="btn-action btn-green" id="btnBet2" onclick="placeBet(2)">BET <span class="btn-sub">NEXT ROUND</span></button>
            <button class="btn-action btn-orange" id="btnCash2" onclick="cashOut(2)">CASHOUT <span class="btn-sub" id="cv2">0.00</span></button>
            <button class="btn-action btn-red" id="btnCan2" onclick="cancel(2)">CANCEL</button>
        </div>
    </div>

    <!-- FAKE PLAYERS -->
    <div class="bottom-tabs">
        <div class="tabs-header">
            <div class="tab-item active">ALL BETS</div>
            <div class="tab-item">MY BETS</div>
            <div class="tab-item">TOP</div>
        </div>
        <div class="bets-list" id="betsList">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="bgMusic" loop>
        <source src="https://www.tbgameloader.com/800/v37/home/static/media/bg_music.eed9358.mp3" type="audio/mpeg">
    </audio>
    <audio id="sndWin" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>
    <audio id="sndCrash" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-game-over-213.mp3"></audio>

    <script>
        // --- 1. CONFIG ---
        // Balance API (For Fetching)
        const URL_FETCH = "/./deepanshu/api/webapi/GetBalance.php";
        // Update API (For Bets/Wins - New File)
        const URL_UPDATE = "api/update_balance.php";

        // IMPORTANT: Token from Login
        const TOKEN = localStorage.getItem('token') || "DEMO_TOKEN"; 

        // State
        let balance = 0.00;
        let status = 'waiting';
        let mult = 1.00;
        let crashPoint = 2.00;
        let history = [1.2, 2.5, 1.1, 5.0, 10.5, 1.05];
        let bets = [{}, {active:false, next:false, amt:0}, {active:false, next:false, amt:0}];
        
        const cvs = document.getElementById('gameCanvas');
        const ctx = cvs.getContext('2d');
        const plane = document.getElementById('plane-svg');
        const mainText = document.getElementById('mainText');
        const flewText = document.getElementById('flewText');

        function resize() { cvs.width = document.getElementById('stage').clientWidth; cvs.height = document.getElementById('stage').clientHeight; }
        window.onresize = resize; resize();

        // --- 2. INITIALIZATION ---
        window.onload = () => {
            fetchBalance(); // Get real balance on load
            renderHistory();
            startWaiting(); // Start Game Loop
            startFakePlayers(); // Start Fake Data

            document.body.addEventListener('click', () => {
                const bg = document.getElementById('bgMusic');
                if(bg.paused) { bg.volume=0.3; bg.play(); }
            }, {once:true});
        };

        // --- 3. BALANCE SYSTEM ---
        async function fetchBalance() {
            try {
                // Generate Signature as per requirements
                const rnd = Math.random().toString(36).substring(7);
                const raw = `{"language":1,"random":"${rnd}"}`;
                const sign = CryptoJS.MD5(raw).toString().toUpperCase();

                const res = await fetch(URL_FETCH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ language: 1, random: rnd, signature: sign, timestamp: Math.floor(Date.now()/1000) })
                });

                const data = await res.json();
                if(data.code === 0 && data.data) {
                    balance = parseFloat(data.data.amount);
                    updateBalUI();
                } else {
                    console.log("Bal API Error:", data.msg);
                    if(balance===0) { balance=1000; updateBalUI(); } // Demo Fallback
                }
            } catch(e) {
                console.log("Fetch Error");
                if(balance===0) { balance=1000; updateBalUI(); }
            }
        }

        async function updateServerBalance(type, amount) {
            // Call our custom update script
            try {
                await fetch(URL_UPDATE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: type, amount: amount })
                });
            } catch(e) {}
        }

        function updateBalUI() { document.getElementById('balDisplay').innerText = balance.toFixed(2); }

        // --- 4. GAME LOGIC (CLIENT SIDE) ---
        function startWaiting() {
            status = 'waiting';
            mult = 1.00;
            
            // UI Reset
            plane.style.display = 'none';
            flewText.style.display = 'none';
            mainText.className = 'multiplier-txt waiting';
            
            // Handle Next Round Bets
            [1,2].forEach(p => {
                if(bets[p].next) {
                    // Deduct
                    balance -= bets[p].amt;
                    updateBalUI();
                    updateServerBalance('bet', bets[p].amt); // Server Sync
                    bets[p].active = true;
                    bets[p].next = false;
                }
                updBtn(p);
            });

            // Countdown
            let cd = 5.0;
            let t = setInterval(() => {
                mainText.innerText = `STARTING IN ${cd.toFixed(1)}s`;
                cd -= 0.1;
                if(cd <= 0) { clearInterval(t); startRunning(); }
            }, 100);
        }

        function startRunning() {
            status = 'running';
            let startTime = Date.now();
            
            // Logic: 50% < 2x, 30% < 5x, 20% > 5x
            let r = Math.random() * 100;
            if(r < 50) crashPoint = 1.00 + Math.random() * 0.9;
            else if(r < 80) crashPoint = 2.00 + Math.random() * 3.0;
            else crashPoint = 5.00 + Math.random() * 20.0;

            plane.style.display = 'block';
            mainText.className = 'multiplier-txt';
            
            function loop() {
                if(status !== 'running') return;
                let elapsed = (Date.now() - startTime) / 1000;
                mult = 1.00 + (0.06 * elapsed * elapsed) + (0.01 * elapsed);

                if(mult >= crashPoint) { crash(); return; }

                // Draw Curve
                drawGraph(mult);
                mainText.innerText = mult.toFixed(2) + 'x';
                
                // Update Cashout Buttons
                [1,2].forEach(p => {
                    if(bets[p].active) document.getElementById(`cv${p}`).innerText = (bets[p].amt * mult).toFixed(2);
                });

                requestAnimationFrame(loop);
            }
            loop();
        }

        function crash() {
            status = 'crashed';
            plane.style.display = 'none';
            mainText.className = 'multiplier-txt crashed';
            mainText.innerText = crashPoint.toFixed(2) + 'x';
            flewText.style.display = 'block';
            document.getElementById('sndCrash').play();

            // History Update
            history.unshift(crashPoint);
            if(history.length > 15) history.pop();
            renderHistory();

            // Clear Active Bets
            [1,2].forEach(p => { if(bets[p].active) { bets[p].active = false; updBtn(p); } });

            setTimeout(startWaiting, 3000);
        }

        // --- 5. GRAPHICS ---
        function drawGraph(m) {
            let w = cvs.width, h = cvs.height;
            ctx.clearRect(0,0,w,h);
            
            let p = Math.min((m - 1) / 4, 1);
            let x = w * p;
            let y = h - (h * p * 0.85);

            ctx.beginPath(); ctx.moveTo(0, h); ctx.quadraticCurveTo(w * 0.1, h, x, y);
            ctx.strokeStyle = '#E50539'; ctx.lineWidth = 5; ctx.stroke();
            
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "rgba(229, 5, 57, 0.4)");
            grad.addColorStop(1, "rgba(229, 5, 57, 0)");
            ctx.fillStyle = grad;
            ctx.lineTo(x, h); ctx.lineTo(0, h); ctx.fill();

            plane.style.left = (x - 20) + 'px';
            plane.style.top = (y - 50) + 'px';
            plane.style.transform = `rotate(${-10 - (p * 20)}deg)`;
        }

        function renderHistory() {
            const b = document.getElementById('historyBar'); b.innerHTML = '';
            history.forEach(v => {
                let c = v < 2 ? 'h-blue' : (v < 10 ? 'h-purple' : 'h-red');
                b.innerHTML += `<div class="hist-pill ${c}">${v.toFixed(2)}x</div>`;
            });
        }

        // --- 6. USER ACTIONS ---
        function placeBet(p) {
            let val = parseFloat(document.getElementById(`bet${p}`).value);
            if(balance < val) { alert("Low Balance"); return; }
            
            bets[p].amt = val;
            if(status === 'waiting') {
                // Deduct & Activate immediately
                balance -= val;
                updateBalUI();
                updateServerBalance('bet', val);
                bets[p].active = true;
            } else {
                bets[p].next = true;
            }
            updBtn(p);
        }

        function cancel(p) {
            if(status === 'waiting' && bets[p].active) {
                // Refund if cancelled during waiting (Optional logic)
                balance += bets[p].amt;
                updateBalUI();
            }
            bets[p].next = false;
            bets[p].active = false;
            updBtn(p);
        }

        function cashOut(p) {
            if(bets[p].active && status === 'running') {
                let win = bets[p].amt * mult;
                balance += win;
                updateBalUI();
                updateServerBalance('win', win); // Sync Server

                // Show Popup
                document.getElementById('winAmount').innerText = win.toFixed(2);
                let m = document.getElementById('winModal');
                m.style.display = 'block';
                setTimeout(()=>m.classList.add('show'), 10);
                document.getElementById('sndWin').play();
                
                setTimeout(() => {
                    m.classList.remove('show');
                    setTimeout(()=>m.style.display='none', 300);
                }, 2000);

                bets[p].active = false;
                updBtn(p);
            }
        }

        function adj(p, v) {
            let el = document.getElementById(`bet${p}`);
            let n = parseFloat(el.value) + v;
            if(n >= 10) el.value = n;
        }

        function updBtn(p) {
            let bB = document.getElementById(`btnBet${p}`);
            let bC = document.getElementById(`btnCash${p}`);
            let bX = document.getElementById(`btnCan${p}`);
            
            bB.style.display='none'; bC.style.display='none'; bX.style.display='none';

            if(bets[p].active) bC.style.display='flex';
            else if(bets[p].next) bX.style.display='flex';
            else {
                bB.style.display='flex';
                bB.innerHTML = (status === 'running') ? `BET <span class="btn-sub">NEXT ROUND</span>` : `BET`;
            }
        }

        // --- 7. FAKE PLAYERS ---
        const names = ['Aarav','Vivaan','Aditya','Vihaan','Arjun','Sai','Reyansh','Ayaan','Krishna','Ishaan'];
        function startFakePlayers() {
            setInterval(() => {
                if(status !== 'running') return;
                if(Math.random() > 0.6) {
                    let n = names[Math.floor(Math.random()*names.length)] + '***';
                    let w = (Math.random()*5000 + 100).toFixed(2);
                    let m = mult.toFixed(2);
                    
                    let html = `
                        <div class="bet-row">
                            <div class="user-col"><div class="avatar">U</div> ${n}</div>
                            <div><span class="win-green">+${w}</span> <span class="mult-badge">${m}x</span></div>
                        </div>
                    `;
                    let list = document.getElementById('betsList');
                    list.insertAdjacentHTML('afterbegin', html);
                    if(list.children.length > 20) list.lastElementChild.remove();
                }
            }, 800);
        }

    </script>
</body>
</html>
